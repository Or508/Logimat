<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>בדיקת מוח AI + עיצוב</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; padding: 40px; text-align: center; }
        h1 { color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        textarea { width: 80%; height: 80px; padding: 15px; font-size: 16px; border-radius: 10px; border: none; background: #333; color: white; }
        button { padding: 12px 30px; font-size: 18px; background: linear-gradient(45deg, #007bff, #00d4ff); color: white; border: none; cursor: pointer; margin-top: 20px; border-radius: 25px; transition: transform 0.2s; font-weight: bold;}
        button:hover { transform: scale(1.05); }
        
        /* אזור התוצאות */
        #result-container { display: none; margin-top: 40px; text-align: right; }
        
        /* כרטיס המידע */
        .info-card { background: #2a2a2a; padding: 20px; border-radius: 15px; border: 1px solid #444; margin-bottom: 30px; }
        .price-tag { font-size: 1.5em; font-weight: bold; color: #00ff88; margin-bottom: 10px; }
        
        /* אזור התצוגה המקדימה - כאן יכנס העיצוב */
        #preview-box {
            border: 2px solid #00d4ff;
            border-radius: 15px;
            overflow: hidden;
            min-height: 400px;
            background: white; /* איפוס לרקע לבן ברירת מחדל */
            position: relative;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
    </style>
</head>
<body>

    <h1>🧠 מחולל אתרים חכם</h1>
    <p>תאר את העסק, וה-AI יעצב לו סקיצה ומחיר:</p>
    
    <textarea id="desc" placeholder="למשל: אתר למסעדה איטלקית יוקרתית עם תפריט וגלריה, בצבעים של שחור וזהב..."></textarea>
    <br>
    <button onclick="testAI()">צור לי אתר 🚀</button>

    <div id="result-container">
        <div class="info-card">
            <div id="price" class="price-tag"></div>
            <p id="summary"></p>
            <p><strong>מבנה מוצע:</strong> <span id="sections"></span></p>
        </div>

        <h2 style="text-align: center; margin-bottom: 10px;">🎨 סקיצה ראשונית מה-AI:</h2>
        <div id="preview-box"></div>
    </div>

    <script>
        async function testAI() {
            const desc = document.getElementById('desc').value;
            const container = document.getElementById('result-container');
            const previewBox = document.getElementById('preview-box');
            
            if (!desc) { alert('נא לכתוב תיאור!'); return; }

            // איפוס וכיתוב טעינה
            container.style.display = 'block';
            previewBox.innerHTML = '<h3 style="color:black; text-align:center; padding-top:100px;">🖌️ המעצב עובד על הסקיצה...</h3>';

            try {
                const response = await fetch('http://localhost:3000/api/ai/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userDescription: desc })
                });

                const data = await response.json();

                // 1. הצגת הנתונים
                document.getElementById('price').innerText = `💰 הערכת מחיר: ${data.min_price}₪ - ${data.max_price}₪`;
                document.getElementById('summary').innerText = data.summary;
                document.getElementById('sections').innerText = data.sections.join(', ');

                // 2. הזרקת העיצוב שה-AI יצר ישירות לדף!
                previewBox.innerHTML = data.html_preview;

            } catch (error) {
                console.error(error);
                previewBox.innerHTML = '<h3 style="color:red; text-align:center;">❌ שגיאה ביצירת העיצוב</h3>';
            }
        }
    </script>

</body>
</html>
