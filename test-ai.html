<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל אתרים חכם - Smart Meeting Platform</title>
    
    <!-- Google Fonts - טיפוגרפיה יוקרתית -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- AOS - Animate On Scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <link rel="stylesheet" href="client/css/globals.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary-color: #f59e0b;
            --accent-color: #ec4899;
            --dark-bg: #0f172a;
            --dark-card: #1e293b;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-gold: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-secondary: 'Poppins', sans-serif;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 16px 64px rgba(0, 0, 0, 0.3);
            --glow: 0 0 30px rgba(99, 102, 241, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-primary);
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Gradient Orbs */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--dark-bg);
            z-index: 0;
        }

        .gradient-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--primary-color);
            top: -250px;
            right: -250px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--accent-color);
            bottom: -200px;
            left: -200px;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: var(--secondary-color);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-secondary);
            text-decoration: none;
        }

        .logo i {
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 2rem 4rem;
            position: relative;
            z-index: 1;
        }

        /* Header Section */
        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            font-family: var(--font-secondary);
            margin-bottom: 1rem;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header p {
            font-size: 1.3rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        .page-header .tagline {
            font-size: 1.5rem;
            margin-top: 1rem;
            color: var(--secondary-color);
            font-weight: 600;
        }

        /* Input Section */
        .input-section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 1.5rem;
            font-size: 1.1rem;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            font-family: var(--font-primary);
            resize: vertical;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .example-chip {
            padding: 0.5rem 1rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            color: var(--primary-light);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-chip:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1.25rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-secondary);
            background: var(--gradient-1);
            color: white;
            box-shadow: var(--shadow-lg);
            text-decoration: none;
            width: 100%;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-xl), var(--glow);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn i {
            font-size: 1.3rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Results Section */
        #result-container {
            display: none;
            margin-top: 3rem;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .info-card h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-family: var(--font-secondary);
            color: var(--primary-light);
        }

        .price-tag {
            font-size: 2rem;
            font-weight: 900;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            font-family: var(--font-secondary);
        }

        .info-card p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .info-card strong {
            color: var(--text-primary);
        }

        .sections-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .section-tag {
            padding: 0.5rem 1rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            color: var(--primary-light);
            font-size: 0.9rem;
        }

        /* Preview Section */
        .preview-section {
            margin-top: 2rem;
        }

        .preview-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .preview-header h2 {
            font-size: 2rem;
            font-weight: 800;
            font-family: var(--font-secondary);
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #preview-box {
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            overflow: hidden;
            min-height: 500px;
            background: white;
            position: relative;
            box-shadow: var(--shadow-xl), 0 0 50px rgba(99, 102, 241, 0.3);
            transition: all 0.3s;
        }

        #preview-box:hover {
            box-shadow: var(--shadow-xl), 0 0 70px rgba(99, 102, 241, 0.5);
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            color: #333;
            gap: 1rem;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(99, 102, 241, 0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            color: #dc2626;
            gap: 1rem;
            padding: 2rem;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 100px 1rem 2rem;
            }

            .input-section {
                padding: 1.5rem;
            }

            .btn {
                padding: 1rem 2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    
    <!-- Gradient Orbs Background -->
    <div class="gradient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-sparkles"></i>
                <span>Smart Meeting</span>
            </a>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-right"></i>
                חזרה לדף הבית
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Page Header -->
        <div class="page-header" data-aos="fade-up">
            <h1>
                <i class="fas fa-magic"></i> מחולל אתרים חכם
            </h1>
            <p>תאר את החלום שלך, וה-AI יהפוך אותו למציאות דיגיטלית</p>
            <div class="tagline">צור לי אתר = הגשם לי חלום</div>
        </div>

        <!-- Input Section -->
        <div class="input-section" data-aos="fade-up" data-aos-delay="200">
            <div class="input-group">
                <label for="desc">
                    <i class="fas fa-pencil-alt"></i> תאר את האתר שברצונך ליצור:
                </label>
                <textarea 
                    id="desc" 
                    placeholder="למשל: אתר למסעדה איטלקית יוקרתית עם תפריט דיגיטלי, גלריה של תמונות, מערכת הזמנות מקוונת, וצבעים של שחור, זהב ולברדור..."
                    rows="5"
                ></textarea>
                <div class="examples">
                    <div class="example-chip" onclick="setExample('אתר למסעדה איטלקית יוקרתית עם תפריט וגלריה')">
                        <i class="fas fa-utensils"></i> מסעדה
                    </div>
                    <div class="example-chip" onclick="setExample('אתר לעסק נדל״ן עם גלריה של נכסים ומערכת חיפוש')">
                        <i class="fas fa-building"></i> נדל״ן
                    </div>
                    <div class="example-chip" onclick="setExample('אתר לעסק בוטיק עם קטלוג מוצרים וחנות מקוונת')">
                        <i class="fas fa-store"></i> בוטיק
                    </div>
                    <div class="example-chip" onclick="setExample('אתר לחברת הייטק עם תיק עבודות ושירותים')">
                        <i class="fas fa-laptop-code"></i> הייטק
                    </div>
                </div>
            </div>
            <button class="btn" onclick="testAI()" id="generateBtn">
                <span>צור לי אתר עכשיו</span>
                <i class="fas fa-rocket"></i>
            </button>
        </div>

        <!-- Results Container -->
        <div id="result-container" data-aos="fade-up" data-aos-delay="400">
            
            <!-- Info Card -->
            <div class="info-card">
                <h2><i class="fas fa-chart-line"></i> הערכת עלות והצעת עיצוב</h2>
                <div id="price" class="price-tag"></div>
                <p id="summary"></p>
                <div id="sections-container" style="margin-top: 1.5rem;">
                    <strong>מבנה מוצע:</strong>
                    <div id="sections" class="sections-list"></div>
                </div>
            </div>

            <!-- Preview Section -->
            <div class="preview-section">
                <div class="preview-header">
                    <h2><i class="fas fa-palette"></i> סקיצה ראשונית מה-AI</h2>
                    <p style="color: var(--text-secondary); margin-top: 0.5rem;">
                        זהו העיצוב שה-AI יצר עבורך - תצוגה מקדימה של ה-Hero Section
                    </p>
                </div>
                <div id="preview-box"></div>
            </div>

        </div>

    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize AOS
        AOS.init({
            duration: 1000,
            once: true,
            offset: 100
        });

        // Set example text
        function setExample(text) {
            document.getElementById('desc').value = text;
            document.getElementById('desc').focus();
        }

        // Main AI function
        async function testAI() {
            const desc = document.getElementById('desc').value.trim();
            const container = document.getElementById('result-container');
            const previewBox = document.getElementById('preview-box');
            const generateBtn = document.getElementById('generateBtn');
            
            if (!desc) {
                alert('⚠️ אנא תאר את האתר שברצונך ליצור');
                return;
            }

            // Show loading state
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span>יוצר אתר...</span><div class="loading-spinner" style="width: 20px; height: 20px; border-width: 2px;"></div>';
            container.style.display = 'block';
            
            previewBox.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <h3 style="color: #333; margin-top: 1rem;">🖌️ המעצב עובד על הסקיצה שלך...</h3>
                    <p style="color: #666;">זה יכול לקחת כמה רגעים</p>
                </div>
            `;

            // Scroll to results
            setTimeout(() => {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);

            try {
                const response = await fetch('http://localhost:3000/api/ai/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userDescription: desc })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Display price
                document.getElementById('price').innerHTML = `
                    <i class="fas fa-coins"></i> הערכת מחיר: ${data.min_price?.toLocaleString('he-IL')}₪ - ${data.max_price?.toLocaleString('he-IL')}₪
                `;

                // Display summary
                document.getElementById('summary').innerText = data.summary || 'העיצוב הוכן בהצלחה!';

                // Display sections
                const sectionsContainer = document.getElementById('sections');
                sectionsContainer.innerHTML = '';
                if (data.sections && Array.isArray(data.sections)) {
                    data.sections.forEach(section => {
                        const tag = document.createElement('div');
                        tag.className = 'section-tag';
                        tag.innerHTML = `<i class="fas fa-check-circle"></i> ${section}`;
                        sectionsContainer.appendChild(tag);
                    });
                }

                // Display preview
                if (data.html_preview) {
                    previewBox.innerHTML = data.html_preview;
                } else {
                    previewBox.innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-triangle" style="font-size: 3rem;"></i>
                            <h3>העיצוב לא התקבל מהשרת</h3>
                            <p>אנא נסה שוב</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error:', error);
                previewBox.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-circle" style="font-size: 3rem;"></i>
                        <h3>❌ שגיאה ביצירת העיצוב</h3>
                        <p>${error.message}</p>
                        <p style="font-size: 0.9rem; color: #999;">ודא שהשרת רץ על http://localhost:3000</p>
                    </div>
                `;
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<span>צור אתר נוסף</span><i class="fas fa-redo"></i>';
            }
        }

        // Enter key to submit
        document.getElementById('desc').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                testAI();
            }
        });
    </script>
</body>
</html>
